<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFS Guild Stats</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #08080a;
            --bg-panel: rgba(15, 10, 10, 0.85);
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-red: #cc0000;
            --accent-glow: rgba(204, 0, 0, 0.4);
            --border-color: #2a1a1a;
            --input-bg: #110a0a;
        }

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at 50% 50%, #0a0000 0%, #050505 60%, #1a0000 100%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #stars-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .left-panel {
            flex: 1.5;
            padding: 25px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(5px);
            overflow-y: auto;
        }

        .left-panel::after {
            content: '';
            position: absolute; right: 0; top: 10%; height: 80%; width: 1px;
            background: linear-gradient(to bottom, transparent, var(--accent-red), transparent);
        }

        .start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 0, 0, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 50;
        }

        .start-btn {
            background: var(--accent-red); color: white;
            font-family: 'Oswald', sans-serif; font-size: 40px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 5px;
            padding: 30px 80px; border: none; border-radius: 10px;
            cursor: pointer; box-shadow: 0 0 40px var(--accent-glow);
            transition: 0.3s;
        }
        .start-btn:hover { background: #ff1a1a; transform: scale(1.05); }

        .top-bar {
            display: flex; gap: 15px; margin-bottom: 10px;
            justify-content: center; align-items: center;
        }

        input[type="date"], input[type="time"] {
            font-family: 'Oswald', sans-serif; font-size: 20px;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-main);
            padding: 10px 20px; border-radius: 12px; outline: none;
            text-align: center; cursor: pointer;
        }

        .clock-display {
            font-family: 'Oswald', sans-serif; font-size: 20px;
            background: rgba(204, 0, 0, 0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(204, 0, 0, 0.3); color: var(--accent-red);
            padding: 10px 20px; border-radius: 12px; font-weight: 700;
        }

        .player-manager { display: flex; justify-content: center; margin-bottom: 15px; }
        .manage-btn {
            background: transparent; color: var(--text-muted);
            border: 1px solid var(--border-color); padding: 6px 15px;
            border-radius: 6px; font-size: 12px; cursor: pointer;
            transition: 0.2s; font-family: 'Oswald', sans-serif; text-transform: uppercase;
        }
        .manage-btn:hover { color: var(--text-main); border-color: var(--accent-red); }

        .roster-block {
            display: flex; gap: 10px; justify-content: center;
            margin-bottom: 15px; max-width: 800px; margin-left: auto; margin-right: auto;
        }

        .roster-col { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }

        select.roster-input {
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700;
            background: #110a0a; border: 1px solid var(--border-color);
            color: var(--text-main); padding: 8px 5px; border-radius: 6px;
            outline: none; text-align: center; transition: 0.3s;
            width: 100%; box-sizing: border-box; cursor: pointer;
            appearance: none; -webkit-appearance: none; -moz-appearance: none;
            text-align-last: center;
        }
        select.roster-input:focus { border-color: var(--accent-red); background: rgba(204, 0, 0, 0.1); }
        select.roster-input option { background: #110a0a; color: #fff; }
        select.roster-sub-input { background: #0d0505; border: 1px dashed #333; color: #aaa; font-size: 11px; }

        .vs-container {
            display: flex; align-items: center; justify-content: space-evenly;
            flex: 1; margin: 0;
        }

        .guild-circle {
            width: 300px; height: 300px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-family: 'Oswald', sans-serif;
            font-weight: 700; font-size: 36px; text-transform: uppercase;
            padding: 20px; box-sizing: border-box; word-break: break-word;
            line-height: 1.1; background: radial-gradient(circle at 30% 30%, #1c0a0a 0%, #080505 100%);
            border: 3px solid var(--border-color); position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,1), 0 10px 40px rgba(0,0,0,0.8);
            transition: 0.3s; text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .guild-circle.nfs { border-color: var(--accent-red); box-shadow: 0 0 40px var(--accent-glow), inset 0 0 40px rgba(204,0,0,0.2); }
        .guild-circle.enemy { cursor: pointer; }
        .guild-circle.enemy:hover { border-color: var(--text-main); box-shadow: 0 0 40px rgba(255,255,255,0.2), inset 0 0 30px rgba(255,255,255,0.1); transform: scale(1.02); }

        .vs-text {
            font-family: 'Oswald', sans-serif; font-size: 90px; font-weight: 700; font-style: italic;
            color: var(--text-main); text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 30px rgba(204, 0, 0, 0.6);
            margin: 0 20px; z-index: 2;
        }

        .score-container { display: flex; align-items: center; justify-content: center; gap: 30px; margin-bottom: 15px; }
        .score-block {
            display: flex; align-items: center; gap: 15px; background: var(--input-bg);
            padding: 10px 25px; border-radius: 12px; border: 1px solid var(--border-color);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .score-input {
            width: 90px; font-family: 'Oswald', sans-serif; font-size: 65px; font-weight: 700;
            text-align: center; background: transparent; border: none; color: var(--text-main);
        }
        .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .score-controls { display: flex; flex-direction: column; gap: 6px; }
        .score-controls button {
            background: #1a0a0a; border: 1px solid #331111; color: var(--text-main);
            padding: 6px 12px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .score-controls button:hover { background: var(--accent-red); border-color: var(--accent-red); }
        .dash { font-family: 'Oswald', sans-serif; font-size: 65px; color: var(--border-color); }

        .action-buttons { display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        .row-actions { display: flex; gap: 15px; }
        
        .btn-save-round {
            flex: 2; background: #1a0a0a; color: white; font-family: 'Oswald', sans-serif;
            font-size: 18px; font-weight: 700; text-transform: uppercase; padding: 15px;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; border: 1px solid #331111;
        }
        .btn-save-round:hover { background: #2a0a0a; border-color: var(--accent-red); }

        .btn-checkbox {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
            background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px;
            color: var(--text-muted); font-family: 'Oswald', sans-serif; font-size: 14px;
            text-transform: uppercase; cursor: pointer;
        }
        .btn-checkbox input { width: 18px; height: 18px; accent-color: var(--accent-red); }

        .btn-finish {
            background: var(--accent-red); color: white; font-family: 'Oswald', sans-serif;
            font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            padding: 15px; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 15px var(--accent-glow); transition: 0.3s;
        }
        .btn-finish:hover { background: #ff1a1a; box-shadow: 0 10px 25px var(--accent-glow); }

        .right-panel {
            width: 400px; background: var(--bg-panel); backdrop-filter: blur(10px);
            border-left: 1px solid var(--border-color); display: flex; flex-direction: column;
            overflow: hidden; z-index: 1; box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }

        .history-section { padding: 20px 25px; display: flex; flex-direction: column; overflow-y: auto; }
        .history-section.current { flex: 1; border-bottom: 1px solid var(--border-color); }
        .history-section.finished { flex: 1.5; background: rgba(0,0,0,0.4); }

        .history-title {
            font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700;
            margin-bottom: 15px; color: var(--text-main); text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        .history-title::before {
            content: ''; display: block; width: 6px; height: 20px;
            background: var(--accent-red); border-radius: 2px;
        }
        .finished .history-title::before { background: var(--text-muted); }

        .history-item {
            background: rgba(20, 10, 10, 0.8); border: 1px solid #331111;
            border-left: 3px solid var(--accent-red); padding: 12px 15px;
            margin-bottom: 10px; border-radius: 4px 8px 8px 4px;
            display: flex; justify-content: space-between; align-items: center; position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover { background: rgba(30, 15, 15, 0.9); }
        .finished .history-item { border-left: 3px solid #444; background: #0d0505; }
        .finished .history-item:hover { background: #150808; }

        .history-info { display: flex; flex-direction: column; gap: 4px; width: 100%;}
        .history-date { font-size: 11px; color: var(--text-muted); font-family: 'Oswald', sans-serif; }
        .history-matchup { font-size: 16px; font-weight: 700; text-transform: uppercase; }
        
        .history-roster {
            font-size: 11px; color: #aaa; margin-top: 4px; line-height: 1.3;
        }
        .history-roster span { color: var(--text-main); font-weight: 700; }
        
        .history-controls { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
        .ctrl-btn {
            background: none; border: none; cursor: pointer; font-size: 12px;
            padding: 2px 5px; opacity: 0.6; transition: 0.2s;
        }
        .ctrl-btn:hover { opacity: 1; transform: scale(1.1); }
        .edit-roster-btn { color: var(--text-main); }
        .delete-btn { color: var(--accent-red); }

        .history-note { font-size: 11px; color: #ffaa00; }
        
        .history-score {
            font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700;
            color: var(--text-main); white-space: nowrap; margin-left: 10px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #110505; padding: 30px; border-radius: 12px;
            border: 1px solid #331111; border-top: 3px solid var(--accent-red);
            width: 350px; text-align: center;
        }
        .modal-input {
            width: 100%; box-sizing: border-box; font-family: 'Oswald', sans-serif;
            font-size: 24px; background: #050000; border: 2px solid var(--border-color);
            color: var(--text-main); padding: 12px; border-radius: 8px;
            margin-bottom: 20px; text-align: center; text-transform: uppercase; outline: none;
        }
        .modal-input:focus { border-color: var(--accent-red); }
        .modal-btn {
            background: var(--accent-red); color: white; font-family: 'Oswald', sans-serif;
            font-size: 18px; font-weight: 700; text-transform: uppercase; padding: 12px;
            border: none; border-radius: 6px; cursor: pointer; width: 100%;
        }
        
        .player-list { text-align: left; max-height: 200px; overflow-y: auto; margin-bottom: 20px; background: #050000; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; }
        .player-list-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; border-bottom: 1px solid #222; }
        .player-list-item:last-child { border-bottom: none; }
        .remove-player-btn { background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 16px; }

        .rounds-list { text-align: left; max-height: 300px; overflow-y: auto; margin-bottom: 20px; background: #050000; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; }
        .round-item { padding: 10px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;}
        .round-item:last-child { border-bottom: none; }
        .round-info { display: flex; flex-direction: column; gap: 4px; }
        .round-time { font-size: 12px; color: var(--text-muted); font-family: 'Oswald', sans-serif; }
        .round-roster { font-size: 11px; color: #aaa; }
        .round-score { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; white-space: nowrap; }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <div class="left-panel">
        <div class="start-screen" id="startScreen">
            <button class="start-btn" onclick="startSession()">НАЧАТЬ СТАК</button>
        </div>

        <div class="top-bar">
            <input type="date" id="match-date">
            <input type="time" id="match-time">
            <div class="clock-display" id="live-clock">00:00:00</div>
        </div>

        <div class="player-manager">
            <button class="manage-btn" onclick="openPlayerManager()">⚙️ Настроить базу игроков</button>
        </div>

        <div class="roster-block">
            <div class="roster-col">
                <select class="roster-input" id="player1"><option value="">Игрок 1</option></select>
                <select class="roster-input roster-sub-input" id="player1_sub"><option value="">Замена</option></select>
            </div>
            <div class="roster-col">
                <select class="roster-input" id="player2"><option value="">Игрок 2</option></select>
                <select class="roster-input roster-sub-input" id="player2_sub"><option value="">Замена</option></select>
            </div>
            <div class="roster-col">
                <select class="roster-input" id="player3"><option value="">Игрок 3</option></select>
                <select class="roster-input roster-sub-input" id="player3_sub"><option value="">Замена</option></select>
            </div>
            <div class="roster-col">
                <select class="roster-input" id="player4"><option value="">Игрок 4</option></select>
                <select class="roster-input roster-sub-input" id="player4_sub"><option value="">Замена</option></select>
            </div>
        </div>

        <div class="vs-container">
            <div class="guild-circle nfs">Need for Speed</div>
            <div class="vs-text">VS</div>
            <div class="guild-circle enemy" id="enemy-guild-display" onclick="openModal()">ВЫБРАТЬ ВРАГА</div>
        </div>

        <div class="score-container">
            <div class="score-block">
                <input type="number" id="score-nfs" class="score-input" value="0" min="0">
                <div class="score-controls">
                    <button onclick="changeScore('score-nfs', 1)">▲</button>
                    <button onclick="changeScore('score-nfs', -1)">▼</button>
                </div>
            </div>
            <div class="dash">:</div>
            <div class="score-block">
                <div class="score-controls">
                    <button onclick="changeScore('score-enemy', 1)">▲</button>
                    <button onclick="changeScore('score-enemy', -1)">▼</button>
                </div>
                <input type="number" id="score-enemy" class="score-input" value="0" min="0">
            </div>
        </div>

        <div class="action-buttons">
            <div class="row-actions">
                <button class="btn-save-round" onclick="saveRound()">СОХРАНИТЬ РАУНД</button>
                <label class="btn-checkbox">
                    <input type="checkbox" id="player-drop"> Не 8/8
                </label>
            </div>
            <button class="btn-finish" onclick="finishMatch()">ЗАКОНЧИТЬ МАТЧ</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="history-section current">
            <div class="history-title">Текущий стак</div>
            <div id="current-history-list"></div>
        </div>
        <div class="history-section finished">
            <div class="history-title">Завершенные матчи</div>
            <div id="finished-history-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="guildModal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-family:'Oswald'; text-transform:uppercase;">Гильдия врага</h3>
            <input type="text" id="guildInput" class="modal-input" list="guild-list" placeholder="Название..." autocomplete="off">
            <datalist id="guild-list"></datalist>
            <button class="modal-btn" onclick="setEnemyGuild()">ОК</button>
        </div>
    </div>

    <div class="modal-overlay" id="editRosterModal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-family:'Oswald'; text-transform:uppercase;">Изменить состав</h3>
            <input type="text" id="editRosterInput" class="modal-input" style="text-transform:none; font-size:16px;" placeholder="Введите состав...">
            <button class="modal-btn" onclick="saveEditedRoster()">Сохранить</button>
        </div>
    </div>

    <div class="modal-overlay" id="playerManagerModal">
        <div class="modal-content" style="width: 400px;">
            <h3 style="margin-top:0; font-family:'Oswald'; text-transform:uppercase;">База игроков</h3>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="newPlayerName" class="modal-input" style="margin-bottom:0; text-transform:none; font-size:16px;" placeholder="Ник игрока...">
                <button class="modal-btn" style="width:auto; padding:0 20px;" onclick="addNewPlayer()">+</button>
            </div>
            <div class="player-list" id="playerListContainer"></div>
            <button class="modal-btn" onclick="closePlayerManager()">Готово</button>
        </div>
    </div>

    <div class="modal-overlay" id="viewRoundsModal">
        <div class="modal-content" style="width: 450px;">
            <h3 style="margin-top:0; font-family:'Oswald'; text-transform:uppercase; color: var(--accent-red);">История раундов</h3>
            <div class="rounds-list" id="roundsListContainer"></div>
            <button class="modal-btn" onclick="document.getElementById('viewRoundsModal').style.display = 'none'">Закрыть</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwetTu2JGB5EdgAIlVQwX94BzRxYiGqPg",
            authDomain: "nfs-tracker.firebaseapp.com",
            projectId: "nfs-tracker",
            storageBucket: "nfs-tracker.firebasestorage.app",
            messagingSenderId: "863438240758",
            appId: "1:863438240758:web:50d401740e2816f10265d7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const matchesCollection = collection(db, "nfs_matches");
        const rosterDocRef = doc(db, "nfs_settings", "roster");

        let currentEnemyGuild = "";
        let currentSessionRounds = [];
        let isSessionActive = false;
        let editingMatchId = null;
        let globalMatches = []; 
        let playerDatabase = [];

        window.updateLiveClock = function() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds}`;
            if (!isSessionActive) {
                document.getElementById('match-time').value = `${hours}:${minutes}`;
                document.getElementById('match-date').value = now.toISOString().split('T')[0];
            }
        };
        setInterval(window.updateLiveClock, 1000);
        window.updateLiveClock();

        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        for (let i = 0; i < 80; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 1.5 + 0.5, speedY: Math.random() * 0.4 + 0.1, opacity: Math.random() * 0.5 + 0.1, pulse: Math.random() * 0.02 + 0.01 });
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y -= p.speedY; p.opacity += p.pulse;
                if (p.opacity > 0.8 || p.opacity < 0.1) p.pulse = -p.pulse;
                if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220, 20, 20, ${p.opacity})`; ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        async function loadPlayersFromFirebase() {
            try {
                const docSnap = await getDoc(rosterDocRef);
                if (docSnap.exists()) {
                    playerDatabase = docSnap.data().players || [];
                } else {
                    playerDatabase = ["Игрок 1", "Игрок 2", "Игрок 3", "Игрок 4"];
                    await setDoc(rosterDocRef, { players: playerDatabase });
                }
            } catch (e) {
                console.error("Ошибка загрузки базы игроков: ", e);
                playerDatabase = JSON.parse(localStorage.getItem('nfs_players')) || ["Игрок 1", "Игрок 2", "Игрок 3", "Игрок 4"];
            }
            updateRosterSelects();
            renderPlayerList();
        }

        async function savePlayersToFirebase() {
            try {
                await setDoc(rosterDocRef, { players: playerDatabase });
                localStorage.setItem('nfs_players', JSON.stringify(playerDatabase));
            } catch (e) {
                console.error("Ошибка сохранения базы игроков: ", e);
                alert("Ошибка! Не удалось сохранить список игроков в облако.");
            }
        }

        window.openPlayerManager = function() {
            document.getElementById('playerManagerModal').style.display = 'flex';
            renderPlayerList();
        }
        window.closePlayerManager = function() {
            document.getElementById('playerManagerModal').style.display = 'none';
            updateRosterSelects();
        }
        window.addNewPlayer = async function() {
            let name = document.getElementById('newPlayerName').value.trim();
            if (name && !playerDatabase.includes(name)) {
                playerDatabase.push(name);
                await savePlayersToFirebase();
                document.getElementById('newPlayerName').value = '';
                renderPlayerList();
                updateRosterSelects();
            }
        }
        window.removePlayer = async function(index) {
            playerDatabase.splice(index, 1);
            await savePlayersToFirebase();
            renderPlayerList();
            updateRosterSelects();
        }

        function renderPlayerList() {
            const container = document.getElementById('playerListContainer');
            container.innerHTML = '';
            playerDatabase.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'player-list-item';
                div.innerHTML = `<span>${p}</span><button class="remove-player-btn" onclick="removePlayer(${index})">✕</button>`;
                container.appendChild(div);
            });
        }
        function updateRosterSelects() {
            for (let i = 1; i <= 4; i++) {
                let mainSelect = document.getElementById(`player${i}`);
                let subSelect = document.getElementById(`player${i}_sub`);
                let currentMainVal = mainSelect.value;
                let currentSubVal = subSelect.value;
                
                mainSelect.innerHTML = `<option value="">Игрок ${i}</option>`;
                subSelect.innerHTML = `<option value="">Замена</option>`;
                
                playerDatabase.forEach(p => {
                    let opt1 = document.createElement('option'); opt1.value = p; opt1.textContent = p;
                    let opt2 = document.createElement('option'); opt2.value = p; opt2.textContent = p;
                    mainSelect.appendChild(opt1);
                    subSelect.appendChild(opt2);
                });
                if (currentMainVal) mainSelect.value = currentMainVal;
                if (currentSubVal) subSelect.value = currentSubVal;
            }
        }

        window.startSession = function() {
            document.getElementById('startScreen').style.display = 'none';
            isSessionActive = true;
            document.getElementById('score-nfs').value = 0;
            document.getElementById('score-enemy').value = 0;
            currentSessionRounds = [];
            document.getElementById('current-history-list').innerHTML = '';
            const display = document.getElementById('enemy-guild-display');
            display.innerText = 'ВЫБРАТЬ ВРАГА';
            display.style.fontSize = '36px';
            currentEnemyGuild = "";
            updateRosterSelects();
            clearRoster();
        };

        window.openModal = function() {
            if (!isSessionActive) return;
            document.getElementById('guildModal').style.display = 'flex';
            document.getElementById('guildInput').focus();
            if (currentEnemyGuild) document.getElementById('guildInput').value = currentEnemyGuild;
        };
        window.setEnemyGuild = function() {
            const val = document.getElementById('guildInput').value.trim().toUpperCase();
            if (val) {
                currentEnemyGuild = val;
                const display = document.getElementById('enemy-guild-display');
                display.innerText = val;
                display.style.fontSize = val.length > 12 ? '24px' : (val.length > 8 ? '30px' : '36px');
                document.getElementById('guildModal').style.display = 'none';
            }
        };
        document.getElementById('guildInput').addEventListener('keypress', function (e) { if (e.key === 'Enter') window.setEnemyGuild(); });

        window.changeScore = function(id, amount) {
            if (!isSessionActive) return;
            const el = document.getElementById(id);
            let val = parseInt(el.value) || 0;
            val += amount;
            if (val < 0) val = 0;
            el.value = val;
        };

        window.clearRoster = function() {
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`player${i}`).value = '';
                document.getElementById(`player${i}_sub`).value = '';
            }
        };
        function getRosterString() {
            let roster = [];
            for (let i = 1; i <= 4; i++) {
                let name = document.getElementById(`player${i}`).value;
                let sub = document.getElementById(`player${i}_sub`).value;
                if (name) {
                    if (sub) roster.push(`${name} (замена: ${sub})`);
                    else roster.push(name);
                }
            }
            return roster.join(', ');
        }

        window.saveRound = function() {
            if (!isSessionActive) return;
            if (!currentEnemyGuild) { alert('Сначала выбери врага!'); return; }
            const scoreNfs = parseInt(document.getElementById('score-nfs').value) || 0;
            const scoreEnemy = parseInt(document.getElementById('score-enemy').value) || 0;
            const isDrop = document.getElementById('player-drop').checked;
            if (scoreNfs === 0 && scoreEnemy === 0) { alert('Счет 0:0, нечего сохранять.'); return; }
            
            // ВРЕМЯ БЕРЕТСЯ С ЖИВЫХ ЧАСОВ, А НЕ ИЗ ИНПУТА
            const now = new Date();
            const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            const rosterString = getRosterString();
            const roundData = { time: currentTime, nfs: scoreNfs, enemy: scoreEnemy, isDrop: isDrop, roster: rosterString };
            currentSessionRounds.unshift(roundData);
            const list = document.getElementById('current-history-list');
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-info">
                    <div class="history-date">Раунд в ${currentTime}</div>
                    ${isDrop ? '<div class="history-note">Не 8/8</div>' : ''}
                    ${rosterString ? `<div class="history-roster"><span>Состав:</span> ${rosterString}</div>` : ''}
                </div>
                <div class="history-score">${scoreNfs} : ${scoreEnemy}</div>
            `;
            list.prepend(item);
            document.getElementById('player-drop').checked = false;
        };

        window.finishMatch = async function() {
            if (!isSessionActive) return;
            if (currentSessionRounds.length === 0) { alert('Вы не сохранили ни одного раунда!'); return; }
            const finalNfs = parseInt(document.getElementById('score-nfs').value) || 0;
            const finalEnemy = parseInt(document.getElementById('score-enemy').value) || 0;
            const lastRound = currentSessionRounds[0];
            const totalNfs = finalNfs !== 0 ? finalNfs : lastRound.nfs;
            const totalEnemy = finalEnemy !== 0 ? finalEnemy : lastRound.enemy;
            const finalRoster = getRosterString();
            const date = document.getElementById('match-date').value;
            const matchData = {
                timestamp: Date.now(),
                date: date,
                enemy: currentEnemyGuild,
                scoreNfs: totalNfs,
                scoreEnemy: totalEnemy,
                rounds: currentSessionRounds.length,
                roundsData: currentSessionRounds, // СОХРАНЯЕМ ИСТОРИЮ РАУНДОВ
                isDrop: currentSessionRounds.some(r => r.isDrop),
                roster: finalRoster
            };
            try {
                await addDoc(matchesCollection, matchData);
                document.getElementById('startScreen').style.display = 'flex';
                isSessionActive = false;
            } catch (e) {
                console.error("Ошибка сохранения: ", e);
                alert("Ошибка! Проверь интернет или настройки Firebase.");
            }
        };

        window.openEditRoster = function(id) {
            editingMatchId = id;
            let match = globalMatches.find(m => m.id === id);
            if (match) {
                document.getElementById('editRosterInput').value = match.roster || '';
                document.getElementById('editRosterModal').style.display = 'flex';
                document.getElementById('editRosterInput').focus();
            }
        };
        window.saveEditedRoster = async function() {
            if (!editingMatchId) return;
            let newRoster = document.getElementById('editRosterInput').value.trim();
            try {
                const matchRef = doc(db, "nfs_matches", editingMatchId);
                await updateDoc(matchRef, { roster: newRoster });
                document.getElementById('editRosterModal').style.display = 'none';
                editingMatchId = null;
            } catch (e) {
                console.error("Ошибка обновления: ", e);
            }
        };
        window.deleteMatch = async function(id) {
            if (confirm('Точно удалить этот матч из общей истории?')) {
                try { await deleteDoc(doc(db, "nfs_matches", id)); }
                catch (e) { console.error("Ошибка удаления: ", e); }
            }
        };

        window.viewRounds = function(id) {
            let match = globalMatches.find(m => m.id === id);
            if (match && match.roundsData) {
                const container = document.getElementById('roundsListContainer');
                container.innerHTML = '';
                match.roundsData.forEach(round => {
                    const div = document.createElement('div');
                    div.className = 'round-item';
                    div.innerHTML = `
                        <div class="round-info">
                            <div class="round-time">Раунд в ${round.time} ${round.isDrop ? '<span style="color:#ffaa00">(Не 8/8)</span>' : ''}</div>
                            ${round.roster ? `<div class="round-roster">Состав: ${round.roster}</div>` : ''}
                        </div>
                        <div class="round-score">${round.nfs} : ${round.enemy}</div>
                    `;
                    container.appendChild(div);
                });
                document.getElementById('viewRoundsModal').style.display = 'flex';
            } else {
                alert("История раундов для этого матча недоступна (возможно, он был сохранен в старой версии сайта).");
            }
        }

        function loadFinishedHistory() {
            const q = query(matchesCollection, orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                globalMatches = [];
                const historyList = document.getElementById('finished-history-list');
                historyList.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const match = docSnap.data();
                    match.id = docSnap.id; 
                    globalMatches.push(match);
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.onclick = (e) => {
                        if (e.target.tagName === 'BUTTON') return;
                        window.viewRounds(match.id);
                    };
                    
                    const dateObj = new Date(match.date);
                    const formattedDate = dateObj.toLocaleDateString('ru-RU');
                    item.innerHTML = `
                        <div class="history-info">
                            <div class="history-date">${formattedDate} (${match.rounds} р.)</div>
                            <div class="history-matchup">NFS vs ${match.enemy}</div>
                            ${match.isDrop ? '<div class="history-note">Были вылеты</div>' : ''}
                            <div class="history-roster">
                                <span>Состав:</span> ${match.roster || 'Не указан'}
                                <div class="history-controls">
                                    <button class="ctrl-btn edit-roster-btn" onclick="openEditRoster('${match.id}')">✏️ Изменить</button>
                                    <button class="ctrl-btn delete-btn" onclick="deleteMatch('${match.id}')">🗑️ Удалить</button>
                                </div>
                            </div>
                        </div>
                        <div class="history-score">${match.scoreNfs} : ${match.scoreEnemy}</div>
                    `;
                    historyList.appendChild(item);
                });
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadPlayersFromFirebase();
            loadFinishedHistory();
        });
    </script>
</body>
</html>
