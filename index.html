<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFS Guild Stats</title>
    <meta name="theme-color" content="#cc0000">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #08080a;
            --bg-panel: rgba(20, 12, 12, 0.6);
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-red: #cc0000;
            --accent-glow: rgba(204, 0, 0, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at 50% 50%, #0a0000 0%, #050505 60%, #1a0000 100%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #stars-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .main-content {
            display: flex;
            flex: 1;
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        .left-panel {
            flex: 1.5;
            padding: 25px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--border-color);
        }

        .start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 0, 0, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; backdrop-filter: blur(10px); gap: 20px;
        }

        .start-btn {
            background: var(--accent-red); color: white;
            font-family: 'Oswald', sans-serif; font-size: 40px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 5px;
            padding: 30px 80px; border: none;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            cursor: pointer; box-shadow: 0 0 40px var(--accent-glow);
            transition: 0.3s;
        }
        .start-btn:hover { background: #ff1a1a; transform: scale(1.05); box-shadow: 0 0 60px var(--accent-glow); }

        .top-bar {
            display: flex; gap: 15px; margin-bottom: 10px;
            justify-content: center; align-items: center; flex-wrap: wrap;
        }

        input[type="date"], input[type="time"] {
            font-family: 'Oswald', sans-serif; font-size: 18px;
            background: var(--input-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); color: var(--text-main);
            padding: 10px 15px; border-radius: 12px; outline: none;
            text-align: center; cursor: pointer;
            transition: 0.3s;
        }
        input[type="date"]:focus, input[type="time"]:focus { border-color: var(--accent-red); box-shadow: 0 0 15px rgba(204,0,0,0.3); }

        .clock-display {
            font-family: 'Oswald', sans-serif; font-size: 18px;
            background: rgba(204, 0, 0, 0.15); backdrop-filter: blur(10px);
            border: 1px solid rgba(204, 0, 0, 0.5); color: var(--accent-red);
            padding: 10px 15px; border-radius: 12px; font-weight: 700;
            box-shadow: 0 0 15px rgba(204,0,0,0.2);
        }

        .player-manager { display: flex; justify-content: center; margin-bottom: 15px; gap: 10px;}
        .manage-btn {
            background: transparent; color: var(--text-muted);
            border: 1px solid var(--border-color); padding: 6px 15px;
            border-radius: 6px; font-size: 12px; cursor: pointer;
            transition: 0.3s; font-family: 'Oswald', sans-serif; text-transform: uppercase;
        }
        .manage-btn:hover { color: var(--text-main); border-color: var(--accent-red); box-shadow: 0 0 10px rgba(204,0,0,0.3); }

        .roster-block {
            display: flex; gap: 10px; justify-content: center;
            margin-bottom: 15px; flex-wrap: wrap;
        }

        .roster-col { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px; max-width: 150px;}
        .select-row { display: flex; gap: 5px; }

        select.roster-input {
            font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700;
            background: var(--input-bg); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 8px 5px; border-radius: 6px;
            outline: none; text-align: center; width: 100%; cursor: pointer;
            transition: 0.3s;
        }
        select.roster-input:focus { border-color: var(--accent-red); box-shadow: 0 0 10px rgba(204,0,0,0.3); }

        .drop-btn {
            background: #1a0a0a; border: 1px solid #331111; color: #555;
            border-radius: 6px; font-size: 16px; cursor: pointer; padding: 0 10px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .drop-btn:hover { border-color: var(--accent-red); }
        .drop-btn.active { background: var(--accent-red); color: white; box-shadow: 0 0 15px var(--accent-glow); border-color: #ff1a1a; }

        .vs-container {
            display: flex; align-items: center; justify-content: space-evenly;
            flex: 1; margin: 20px 0; flex-wrap: wrap; gap: 20px;
        }

        .circle-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; }

        .guild-circle {
            width: 200px; height: 200px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-family: 'Oswald', sans-serif;
            font-weight: 700; font-size: 28px; text-transform: uppercase;
            padding: 15px; word-break: break-word;
            background: radial-gradient(circle at 30% 30%, #1c0a0a 0%, #080505 100%);
            border: 3px solid var(--border-color);
            box-shadow: inset 0 0 30px rgba(0,0,0,1), 0 10px 40px rgba(0,0,0,0.8);
            transition: 0.3s; text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .guild-circle.nfs { border-color: var(--accent-red); box-shadow: 0 0 40px var(--accent-glow), inset 0 0 40px rgba(204,0,0,0.2); }
        .guild-circle.enemy { cursor: pointer; }
        .guild-circle.enemy:hover { border-color: var(--text-main); box-shadow: 0 0 50px rgba(255,255,255,0.3), inset 0 0 30px rgba(255,255,255,0.1); transform: scale(1.02); }

        .progress-bar-bg { width: 150px; height: 8px; background: #111; border-radius: 4px; border: 1px solid #333; overflow: hidden;}
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #550000, #ff1a1a); transition: width 0.5s; box-shadow: 0 0 10px var(--accent-red); }

        .vs-text { font-family: 'Oswald', sans-serif; font-size: 60px; font-weight: 700; font-style: italic; color: var(--text-main); text-shadow: 0 0 20px rgba(255,255,255,0.2);}

        .score-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;}
        .score-block {
            display: flex; align-items: center; gap: 10px; background: var(--input-bg);
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border-color);
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .score-input {
            width: 80px; font-family: 'Oswald', sans-serif; font-size: 50px; font-weight: 700;
            text-align: center; background: transparent; border: none; color: var(--text-main);
            transition: transform 0.1s ease, color 0.2s;
        }
        .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .pulse-anim { transform: scale(1.2); color: var(--accent-red) !important; }

        .score-controls { display: flex; flex-direction: column; gap: 5px; }
        .score-controls button {
            background: linear-gradient(180deg, #2a2a2a 0%, #111 100%);
            border: 1px solid #444; border-bottom: 3px solid #000;
            color: #fff; padding: 5px 10px; font-size: 14px; 
            cursor: pointer; text-shadow: 0 -1px 0 rgba(0,0,0,0.5); transition: 0.1s;
        }
        .score-controls button:active { transform: translateY(2px); background: var(--accent-red); border-bottom: 1px solid #000;}

        .dash { font-family: 'Oswald', sans-serif; font-size: 50px; color: var(--text-muted); }

        .action-buttons { display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        .row-actions { display: flex; gap: 15px; flex-wrap: wrap;}
        
        .btn-save-round {
            flex: 2; background: #1a0a0a; color: white; font-family: 'Oswald', sans-serif;
            font-size: 16px; font-weight: 700; text-transform: uppercase; padding: 15px;
            border: 1px solid #331111; cursor: pointer;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
            transition: 0.3s;
        }
        .btn-save-round:hover { background: #2a0a0a; border-color: var(--accent-red); box-shadow: 0 0 20px rgba(204,0,0,0.3); }

        .btn-finish {
            background: var(--accent-red); color: white; font-family: 'Oswald', sans-serif;
            font-size: 20px; font-weight: 700; text-transform: uppercase;
            padding: 15px; border: none; cursor: pointer;
            clip-path: polygon(2% 0, 98% 0, 100% 100%, 0% 100%);
            box-shadow: 0 5px 15px var(--accent-glow); transition: 0.3s;
        }
        .btn-finish:hover { background: #ff1a1a; box-shadow: 0 10px 30px var(--accent-glow); }

        .live-btn-container { display: flex; justify-content: center; margin-bottom: 10px; }
        .btn-live {
            background: linear-gradient(90deg, #cc0000, #ff4400); color: white;
            font-family: 'Oswald'; font-size: 14px; padding: 8px 20px; border: none; border-radius: 20px;
            cursor: pointer; box-shadow: 0 0 15px rgba(204,0,0,0.5); font-weight: bold;
            display: flex; align-items: center; gap: 5px; transition: 0.3s;
        }
        .btn-live:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(204,0,0,0.8); }

        /* ПРАВАЯ ПАНЕЛЬ */
        .right-panel {
            width: 400px; background: rgba(10, 5, 5, 0.7); backdrop-filter: blur(15px);
            display: flex; flex-direction: column;
        }

        .history-section { padding: 20px; display: flex; flex-direction: column; }
        .history-section.current { border-bottom: 1px solid var(--border-color); }
        
        .history-title {
            font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700;
            margin-bottom: 15px; color: var(--text-main); text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .history-item {
            background: rgba(20, 10, 10, 0.6); border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-red); padding: 12px;
            margin-bottom: 10px; border-radius: 4px; display: flex; flex-direction: column;
            transition: 0.3s;
        }
        .history-item:hover { background: rgba(30, 15, 15, 0.8); box-shadow: 0 0 15px rgba(204,0,0,0.1); }

        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-content.open { max-height: 500px; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }

        .history-main-row { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .history-score { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; }
        
        .history-controls { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px;}
        .ctrl-btn {
            background: rgba(0,0,0,0.5); border: 1px solid #333; cursor: pointer; font-size: 11px;
            padding: 5px 8px; border-radius: 4px; color: white; transition: 0.2s;
        }
        .ctrl-btn:hover { background: var(--accent-red); border-color: var(--accent-red); }

        /* ИСПРАВЛЕНИЕ СТИЛЕЙ ЗАЧЕРКИВАНИЯ И ЖЕЛТОЙ ПОМЕТКИ */
        .dropped { color: #ff4444 !important; text-decoration: line-through; }
        .history-note { font-size: 12px; color: #ffaa00 !important; font-weight: bold; margin-top: 2px;}

        footer {
            position: relative; padding: 10px; text-align: center;
            font-size: 10px; color: rgba(255,255,255,0.3); font-family: 'Oswald', sans-serif;
            background: rgba(0,0,0,0.8); z-index: 10;
        }
        footer a { color: rgba(255,255,255,0.5); text-decoration: none; transition: 0.3s;}
        footer a:hover { color: var(--accent-red); }

        /* МОДАЛКИ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #110505; padding: 20px; border-radius: 12px;
            border: 1px solid #331111; border-top: 3px solid var(--accent-red);
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-input { width: 100%; padding: 10px; margin-bottom: 15px; background: #050000; border: 1px solid #333; color: white; font-size: 18px; text-align: center; }
        .modal-btn { background: var(--accent-red); color: white; padding: 12px; width: 100%; border: none; cursor: pointer; font-weight: bold; }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 900px) {
            .main-content { flex-direction: column; }
            .left-panel { padding: 15px; }
            .right-panel { width: 100%; border-left: none; border-top: 1px solid var(--border-color); }
            .roster-col { min-width: 45%; }
            .guild-circle { width: 140px; height: 140px; font-size: 20px; }
            .vs-text { font-size: 40px; }
            .score-input { font-size: 40px; width: 60px; }
            .score-block { padding: 5px 10px; }
            .start-btn { font-size: 24px; padding: 20px 40px; }
        }

        /* --- СТИЛИ ДЛЯ LIVE ТАБЛО --- */
        .viewer-mode { background: radial-gradient(circle at 50% 50%, #1a0000 0%, #000 100%) !important; }
        .viewer-container {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            width: 100%; max-width: 1000px; margin: 0 auto; padding: 40px 20px; z-index: 10;
        }
        .live-badge {
            background: #cc0000; color: white; font-family: 'Oswald'; padding: 5px 15px; border-radius: 4px;
            font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; animation: pulse 2s infinite;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .viewer-scoreboard {
            display: flex; align-items: center; justify-content: space-between; width: 100%;
            background: rgba(20, 10, 10, 0.8); border: 2px solid #331111; border-radius: 20px;
            padding: 40px; box-shadow: 0 0 50px rgba(204,0,0,0.3); margin-bottom: 40px;
        }
        .viewer-team { text-align: center; flex: 1; }
        .viewer-team h2 { font-family: 'Oswald'; font-size: 40px; margin: 0 0 10px 0; text-transform: uppercase; }
        .viewer-score { font-family: 'Oswald'; font-size: 120px; font-weight: 700; line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .viewer-score.nfs { color: #ff1a1a; }
        .viewer-score.enemy { color: #fff; }
        .viewer-vs { font-family: 'Oswald'; font-size: 60px; font-style: italic; color: #555; }

        .viewer-rounds {
            width: 100%; background: rgba(10, 5, 5, 0.8); border: 1px solid #331111;
            border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px;
        }
        .viewer-round-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 15, 15, 0.5); padding: 15px 20px; border-radius: 8px;
            border-left: 4px solid #cc0000; animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .viewer-round-score { font-family: 'Oswald'; font-size: 30px; font-weight: 700; }
        .viewer-roster { text-align: center; font-size: 18px; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>
    
    <div class="main-content" id="app-content">
        <!-- Основной интерфейс -->
        <div class="left-panel" id="main-panel">
            <div class="start-screen" id="startScreen">
                <button class="start-btn" onclick="startSession()">НАЧАТЬ СТАК</button>
            </div>

            <div class="top-bar">
                <input type="date" id="match-date">
                <input type="time" id="match-time">
                <div class="clock-display" id="live-clock">00:00:00</div>
            </div>

            <div class="player-manager">
                <button class="manage-btn" onclick="openPlayerManager()">⚙️ База игроков</button>
            </div>

            <div class="roster-block">
                <div class="roster-col">
                    <div class="select-row">
                        <select class="roster-input" id="player1"><option value="">Игрок 1</option></select>
                        <button class="drop-btn" onclick="toggleDrop(this, 1)">➖</button>
                    </div>
                    <select class="roster-input" id="player1_sub"><option value="">Замена</option></select>
                </div>
                <div class="roster-col">
                    <div class="select-row">
                        <select class="roster-input" id="player2"><option value="">Игрок 2</option></select>
                        <button class="drop-btn" onclick="toggleDrop(this, 2)">➖</button>
                    </div>
                    <select class="roster-input" id="player2_sub"><option value="">Замена</option></select>
                </div>
                <div class="roster-col">
                    <div class="select-row">
                        <select class="roster-input" id="player3"><option value="">Игрок 3</option></select>
                        <button class="drop-btn" onclick="toggleDrop(this, 3)">➖</button>
                    </div>
                    <select class="roster-input" id="player3_sub"><option value="">Замена</option></select>
                </div>
                <div class="roster-col">
                    <div class="select-row">
                        <select class="roster-input" id="player4"><option value="">Игрок 4</option></select>
                        <button class="drop-btn" onclick="toggleDrop(this, 4)">➖</button>
                    </div>
                    <select class="roster-input" id="player4_sub"><option value="">Замена</option></select>
                </div>
            </div>

            <div class="live-btn-container">
                <button class="btn-live" id="live-btn" onclick="startLiveBroadcast()">🔴 Включить LIVE-ТАБЛО</button>
            </div>

            <div class="vs-container">
                <div class="circle-wrapper">
                    <div class="guild-circle nfs">Need for Speed</div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-nfs"></div></div>
                </div>
                <div class="vs-text">VS</div>
                <div class="circle-wrapper">
                    <div class="guild-circle enemy" id="enemy-guild-display" onclick="openModal()">ВРАГ</div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-enemy"></div></div>
                </div>
            </div>

            <div class="score-container">
                <div class="score-block">
                    <input type="number" id="score-nfs" class="score-input" value="0" min="0">
                    <div class="score-controls">
                        <button onclick="changeScore('score-nfs', 1)">▲</button>
                        <button onclick="changeScore('score-nfs', -1)">▼</button>
                    </div>
                </div>
                <div class="dash">:</div>
                <div class="score-block">
                    <div class="score-controls">
                        <button onclick="changeScore('score-enemy', 1)">▲</button>
                        <button onclick="changeScore('score-enemy', -1)">▼</button>
                    </div>
                    <input type="number" id="score-enemy" class="score-input" value="0" min="0">
                </div>
            </div>

            <div class="action-buttons">
                <div class="row-actions">
                    <button class="btn-save-round" onclick="saveRound()">СОХРАНИТЬ РАУНД</button>
                    <label class="btn-checkbox" style="flex:1; display:flex; justify-content:center; align-items:center; background:#110a0a; border:1px solid #333; padding:0 10px; font-size:12px; font-family:Oswald;">
                        <input type="checkbox" id="player-drop" style="margin-right:5px;"> Не 8/8
                    </label>
                </div>
                <button class="btn-finish" onclick="finishMatch()">ЗАКОНЧИТЬ МАТЧ</button>
            </div>
        </div>

        <div class="right-panel" id="side-panel">
            <div class="history-section current">
                <div class="history-title">Текущий стак</div>
                <div id="current-history-list"></div>
            </div>
            <div class="history-section finished">
                <div class="history-title">
                    Завершенные матчи
                    <button class="manage-btn" onclick="exportAllToCSV()" style="font-size:10px; padding:4px 8px;">⬇️ CSV (Все)</button>
                </div>
                <div id="finished-history-list"></div>
            </div>
        </div>
    </div>

    <!-- LIVE ТАБЛО -->
    <div id="viewer-ui" style="display:none; width:100%; height:100%; position:relative; z-index:10;">
        <div class="viewer-container">
            <div class="live-badge">LIVE MATCH</div>
            
            <div class="viewer-scoreboard">
                <div class="viewer-team">
                    <h2>NFS</h2>
                    <div class="viewer-score nfs" id="v-score-nfs">0</div>
                </div>
                <div class="viewer-vs">VS</div>
                <div class="viewer-team">
                    <h2 id="v-enemy-name">ОЖИДАНИЕ</h2>
                    <div class="viewer-score enemy" id="v-score-enemy">0</div>
                </div>
            </div>

            <div class="viewer-roster" id="v-roster">Состав: Загрузка...</div>

            <div class="viewer-rounds" id="v-rounds-container"></div>
        </div>
    </div>

    <footer id="main-footer">
        &copy; 2026 <a href="https://vk.ru/need_for_speedl" target="_blank">Need For Speed</a> | Author: mefsol
    </footer>

    <!-- МОДАЛКИ -->
    <div class="modal-overlay" id="guildModal">
        <div class="modal-content">
            <h3>Гильдия врага</h3>
            <input type="text" id="guildInput" class="modal-input" placeholder="Название...">
            <button class="modal-btn" onclick="setEnemyGuild()">ОК</button>
        </div>
    </div>

    <div class="modal-overlay" id="editRoundModal">
        <div class="modal-content">
