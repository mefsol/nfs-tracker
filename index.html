<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFS Guild Stats</title>
    <meta name="theme-color" content="#cc0000">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #08080a;
            --bg-panel: rgba(20, 12, 12, 0.6);
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-red: #cc0000;
            --accent-glow: rgba(204, 0, 0, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at 50% 50%, #0a0000 0%, #050505 60%, #1a0000 100%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Строгая высота экрана */
            overflow: hidden; /* Запрет скролла всей страницы */
        }

        #stars-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .main-content {
            display: flex;
            flex: 1;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .left-panel {
            flex: 1.5;
            padding: 25px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--border-color);
            overflow-y: auto; /* Если экран маленький, левая панель скроллится */
        }

        /* СТАРТОВЫЙ ЭКРАН */
        .start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 0, 0, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; backdrop-filter: blur(10px); gap: 20px;
        }

        .start-btn {
            background: var(--accent-red); color: white;
            font-family: 'Oswald', sans-serif; font-size: 40px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 5px;
            padding: 30px 80px; border: none;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            cursor: pointer; box-shadow: 0 0 40px var(--accent-glow);
            transition: 0.3s;
        }
        .start-btn:hover { background: #ff1a1a; transform: scale(1.05); box-shadow: 0 0 60px var(--accent-glow); }

        .top-bar {
            display: flex; gap: 15px; margin-bottom: 10px;
            justify-content: center; align-items: center; flex-wrap: wrap;
        }

        input[type="date"], input[type="time"] {
            font-family: 'Oswald', sans-serif; font-size: 18px;
            background: var(--input-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); color: var(--text-main);
            padding: 10px 15px; border-radius: 12px; outline: none;
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        input[type="date"]:focus, input[type="time"]:focus { border-color: var(--accent-red); box-shadow: 0 0 15px rgba(204,0,0,0.3); }

        .clock-display {
            font-family: 'Oswald', sans-serif; font-size: 18px;
            background: rgba(204, 0, 0, 0.15); backdrop-filter: blur(10px);
            border: 1px solid rgba(204, 0, 0, 0.5); color: var(--accent-red);
            padding: 10px 15px; border-radius: 12px; font-weight: 700;
            box-shadow: 0 0 15px rgba(204,0,0,0.2);
        }

        .player-manager { display: flex; justify-content: center; margin-bottom: 15px; gap: 10px;}
        .manage-btn {
            background: transparent; color: var(--text-muted);
            border: 1px solid var(--border-color); padding: 6px 15px;
            border-radius: 6px; font-size: 12px; cursor: pointer;
            transition: 0.3s; font-family: 'Oswald', sans-serif; text-transform: uppercase;
        }
        .manage-btn:hover { color: var(--text-main); border-color: var(--accent-red); box-shadow: 0 0 10px rgba(204,0,0,0.3); }

        .roster-block {
            display: flex; gap: 10px; justify-content: center;
            margin-bottom: 15px; flex-wrap: wrap;
        }

        .roster-col { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px; max-width: 150px;}
        .select-row { display: flex; gap: 5px; }

        select.roster-input {
            font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700;
            background: var(--input-bg); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 8px 5px; border-radius: 6px;
            outline: none; text-align: center; width: 100%; cursor: pointer; transition: 0.3s;
        }
        select.roster-input:focus { border-color: var(--accent-red); box-shadow: 0 0 10px rgba(204,0,0,0.3); }

        .drop-btn {
            background: #1a0a0a; border: 1px solid #331111; color: #555;
            border-radius: 6px; font-size: 16px; cursor: pointer; padding: 0 10px;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .drop-btn:hover { border-color: var(--accent-red); }
        .drop-btn.active { background: var(--accent-red); color: white; box-shadow: 0 0 15px var(--accent-glow); border-color: #ff1a1a; }

        .vs-container {
            display: flex; align-items: center; justify-content: space-evenly;
            flex: 1; margin: 20px 0; flex-wrap: wrap; gap: 20px;
        }

        .circle-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; }

        .guild-circle {
            width: 200px; height: 200px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-family: 'Oswald', sans-serif;
            font-weight: 700; font-size: 28px; text-transform: uppercase;
            padding: 15px; word-break: break-word;
            background: radial-gradient(circle at 30% 30%, #1c0a0a 0%, #080505 100%);
            border: 3px solid var(--border-color);
            box-shadow: inset 0 0 30px rgba(0,0,0,1), 0 10px 40px rgba(0,0,0,0.8);
            transition: 0.3s; text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .guild-circle.nfs { border-color: var(--accent-red); box-shadow: 0 0 40px var(--accent-glow), inset 0 0 40px rgba(204,0,0,0.2); }
        .guild-circle.enemy { cursor: pointer; }
        .guild-circle.enemy:hover { border-color: var(--text-main); box-shadow: 0 0 50px rgba(255,255,255,0.3), inset 0 0 30px rgba(255,255,255,0.1); transform: scale(1.02); }

        .vs-text { font-family: 'Oswald', sans-serif; font-size: 60px; font-weight: 700; font-style: italic; color: var(--text-main); text-shadow: 0 0 20px rgba(255,255,255,0.2);}

        .score-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;}
        .score-block {
            display: flex; align-items: center; gap: 10px; background: var(--input-bg);
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border-color);
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .score-input {
            width: 80px; font-family: 'Oswald', sans-serif; font-size: 50px; font-weight: 700;
            text-align: center; background: transparent; border: none; color: var(--text-main);
            transition: transform 0.1s ease, color 0.2s;
        }
        .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .pulse-anim { transform: scale(1.2); color: var(--accent-red) !important; }

        .score-controls { display: flex; flex-direction: column; gap: 5px; }
        .score-controls button {
            background: linear-gradient(180deg, #2a2a2a 0%, #111 100%);
            border: 1px solid #444; border-bottom: 3px solid #000;
            color: #fff; padding: 5px 10px; font-size: 14px; 
            cursor: pointer; text-shadow: 0 -1px 0 rgba(0,0,0,0.5); transition: 0.1s;
        }
        .score-controls button:active { transform: translateY(2px); background: var(--accent-red); border-bottom: 1px solid #000;}

        .dash { font-family: 'Oswald', sans-serif; font-size: 50px; color: var(--text-muted); }

        .action-buttons { display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        .row-actions { display: flex; gap: 15px; flex-wrap: wrap;}
        
        .btn-save-round {
            flex: 2; background: #1a0a0a; color: white; font-family: 'Oswald', sans-serif;
            font-size: 16px; font-weight: 700; text-transform: uppercase; padding: 15px;
            border: 1px solid #331111; cursor: pointer;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
            transition: 0.3s;
        }
        .btn-save-round:hover { background: #2a0a0a; border-color: var(--accent-red); box-shadow: 0 0 20px rgba(204,0,0,0.3); }

        .btn-finish {
            background: var(--accent-red); color: white; font-family: 'Oswald', sans-serif;
            font-size: 20px; font-weight: 700; text-transform: uppercase;
            padding: 15px; border: none; cursor: pointer;
            clip-path: polygon(2% 0, 98% 0, 100% 100%, 0% 100%);
            box-shadow: 0 5px 15px var(--accent-glow); transition: 0.3s;
        }
        .btn-finish:hover { background: #ff1a1a; box-shadow: 0 10px 30px var(--accent-glow); }

        .live-btn-container { display: flex; justify-content: center; margin-bottom: 10px; }
        .btn-live {
            background: linear-gradient(90deg, #cc0000, #ff4400); color: white;
            font-family: 'Oswald'; font-size: 14px; padding: 8px 20px; border: none; border-radius: 20px;
            cursor: pointer; box-shadow: 0 0 15px rgba(204,0,0,0.5); font-weight: bold;
            display: flex; align-items: center; gap: 5px; transition: 0.3s;
        }
        .btn-live:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(204,0,0,0.8); }

        /* ПРАВАЯ ПАНЕЛЬ С ВКЛАДКАМИ */
        .right-panel {
            width: 420px; background: rgba(10, 5, 5, 0.7); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .tabs-header {
            display: flex; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.3);
        }
        .tab-btn {
            flex: 1; padding: 15px; background: transparent; border: none; border-bottom: 2px solid transparent;
            color: var(--text-muted); font-family: 'Oswald'; font-size: 16px; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .tab-btn.active { color: var(--accent-red); border-bottom-color: var(--accent-red); background: rgba(204,0,0,0.1); text-shadow: 0 0 10px var(--accent-glow); }

        .tab-content {
            flex: 1; overflow-y: auto; padding: 20px; display: none;
        }
        .tab-content.active { display: block; }

        /* СКРОЛЛБАР */
        .tab-content::-webkit-scrollbar { width: 6px; }
        .tab-content::-webkit-scrollbar-track { background: transparent; }
        .tab-content::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .tab-content::-webkit-scrollbar-thumb:hover { background: var(--accent-red); }

        .history-item {
            background: rgba(20, 10, 10, 0.6); border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-red); padding: 12px;
            margin-bottom: 10px; border-radius: 4px; display: flex; flex-direction: column;
            transition: 0.3s;
        }
        .history-item:hover { background: rgba(30, 15, 15, 0.8); box-shadow: 0 0 15px rgba(204,0,0,0.1); }

        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .accordion-content.open { max-height: 500px; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }

        .history-main-row { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .history-score { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; }
        
        .history-controls { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px;}
        .ctrl-btn {
            background: rgba(0,0,0,0.5); border: 1px solid #333; cursor: pointer; font-size: 11px;
            padding: 5px 8px; border-radius: 4px; color: white; transition: 0.2s;
        }
        .ctrl-btn:hover { background: var(--accent-red); border-color: var(--accent-red); }

        .dropped { color: #ff4444 !important; text-decoration: line-through; }
        .history-note { font-size: 12px; color: #ffaa00 !important; font-weight: bold; margin-top: 2px;}

        footer {
            position: relative; padding: 10px; text-align: center;
            font-size: 10px; color: rgba(255,255,255,0.3); font-family: 'Oswald', sans-serif;
            background: rgba(0,0,0,0.8); z-index: 10;
        }
        footer a { color: rgba(255,255,255,0.5); text-decoration: none; transition: 0.3s;}
        footer a:hover { color: var(--accent-red); }

        /* МОДАЛКИ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #110505; padding: 20px; border-radius: 12px;
            border: 1px solid #331111; border-top: 3px solid var(--accent-red);
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-input { width: 100%; padding: 10px; margin-bottom: 15px; background: #050000; border: 1px solid #333; color: white; font-size: 18px; text-align: center; }
        .modal-btn { background: var(--accent-red); color: white; padding: 12px; width: 100%; border: none; cursor: pointer; font-weight: bold; }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 900px) {
            .main-content { flex-direction: column; }
            .left-panel { padding: 15px; }
            .right-panel { width: 100%; border-left: none; border-top: 1px solid var(--border-color); height: 50vh;}
            .roster-col { min-width: 45%; }
            .guild-circle { width: 140px; height: 140px; font-size: 20px; }
            .vs-text { font-size: 40px; }
            .score-input { font-size: 40px; width: 60px; }
            .score-block { padding: 5px 10px; }
            .start-btn { font-size: 24px; padding: 20px 40px; }
        }

        /* --- СТИЛИ ДЛЯ LIVE ТАБЛО --- */
        .viewer-mode { background: radial-gradient(circle at 50% 50%, #1a0000 0%, #000 100%) !important; }
        .viewer-container {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            width: 100%; max-width: 1000px; margin: 0 auto; padding: 40px 20px; z-index: 10;
        }
        .live-badge {
            background: #cc0000; color: white; font-family: 'Oswald'; padding: 5px 15px; border-radius: 4px;
            font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; animation: pulse 2s infinite;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .viewer-scoreboard {
            display: flex; align-items: center; justify-content: space-between; width: 100%;
            background: rgba(20, 10, 10, 0.8); border: 2px solid #331111; border-radius: 20px;
            padding: 40px; box-shadow: 0 0 50px rgba(204,0,0,0.3); margin-bottom: 40px;
        }
        .viewer-team { text-align: center; flex: 1; }
        .viewer-team h2 { font-family: 'Oswald'; font-size: 40px; margin: 0 0 10px 0; text-transform: uppercase; }
        .viewer-score { font-family: 'Oswald'; font-size: 120px; font-weight: 700; line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .viewer-score.nfs { color: #ff1a1a; }
        .viewer-score.enemy { color: #fff; }
        .viewer-vs { font-family: 'Oswald'; font-size: 60px; font-style: italic; color: #555; }

        .viewer-rounds {
            width: 100%; background: rgba(10, 5, 5, 0.8); border: 1px solid #331111;
            border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px;
        }
        .viewer-round-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 15, 15, 0.5); padding: 15px 20px; border-radius: 8px;
            border-left: 4px solid #cc0000; animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .viewer-round-score { font-family: 'Oswald'; font-size: 30px; font-weight: 700; }
        .viewer-roster { text-align: center; font-size: 18px; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>
    
    <div class="main-content" id="app-content">
        <div class="left-panel" id="main-panel">
            <div class="start-screen" id="startScreen">
                <button class="start-btn" onclick="startSession()">НАЧАТЬ СТАК</button>
            </div>

            <div class="top-bar">
                <input type="date" id="match-date">
                <input type="time" id="match-time">
                <div class="clock-display" id="live-clock">00:00:00</div>
            </div>

            <div class="player-manager">
                <button class="manage-btn" onclick="openPlayerManager()">⚙️ База игроков</button>
            </div>

            <div class="roster-block">
                <div class="roster-col">
                    <div class="select-row">
                        <select class="roster-input" id="player1"><option value="">Игрок 1</option></select>
                        <button class="drop-btn" onclick="toggleDrop(this, 1)">➖</button>
                    </div>
                    <select class="roster-input" id="player1_sub"><option value="">Замена</option></select>
                </div>
                <div class="roster-col">
                    <div class="select-row">
                        <select class="roster-input" id="player2"><option value="">Игрок 2</option></select>
                        <button class="drop-btn" onclick="toggleDrop(this, 2)">➖</button>
                    </div>
                    <select class="roster-input" id="player2_sub"><option value="">Замена</option></select>
                </div>
                <div class="roster-col">
                    <div class="select-row">
                        <select class="roster-input" id="player3"><option value="">Игрок 3</option></select>
                        <button class="drop-btn" onclick="toggleDrop(this, 3)">➖</button>
                    </div>
                    <select class="roster-input" id="player3_sub"><option value="">Замена</option></select>
                </div>
                <div class="roster-col">
                    <div class="select-row">
                        <select class="roster-input" id="player4"><option value="">Игрок 4</option></select>
                        <button class="drop-btn" onclick="toggleDrop(this, 4)">➖</button>
                    </div>
                    <select class="roster-input" id="player4_sub"><option value="">Замена</option></select>
                </div>
            </div>

            <div class="live-btn-container">
                <button class="btn-live" id="live-btn" onclick="startLiveBroadcast()">🔴 Включить LIVE-ТАБЛО</button>
            </div>

            <div class="vs-container">
                <div class="circle-wrapper">
                    <div class="guild-circle nfs">Need for Speed</div>
                </div>
                <div class="vs-text">VS</div>
                <div class="circle-wrapper">
                    <div class="guild-circle enemy" id="enemy-guild-display" onclick="openModal()">ВРАГ</div>
                </div>
            </div>

            <div class="score-container">
                <div class="score-block">
                    <input type="number" id="score-nfs" class="score-input" value="0" min="0">
                    <div class="score-controls">
                        <button onclick="changeScore('score-nfs', 1)">▲</button>
                        <button onclick="changeScore('score-nfs', -1)">▼</button>
                    </div>
                </div>
                <div class="dash">:</div>
                <div class="score-block">
                    <div class="score-controls">
                        <button onclick="changeScore('score-enemy', 1)">▲</button>
                        <button onclick="changeScore('score-enemy', -1)">▼</button>
                    </div>
                    <input type="number" id="score-enemy" class="score-input" value="0" min="0">
                </div>
            </div>

            <div class="action-buttons">
                <div class="row-actions">
                    <button class="btn-save-round" onclick="saveRound()">СОХРАНИТЬ РАУНД</button>
                    <label class="btn-checkbox" style="flex:1; display:flex; justify-content:center; align-items:center; background:#110a0a; border:1px solid #333; padding:0 10px; font-size:12px; font-family:Oswald;">
                        <input type="checkbox" id="player-drop" style="margin-right:5px;"> Не 8/8
                    </label>
                </div>
                <button class="btn-finish" onclick="finishMatch()">ЗАКОНЧИТЬ МАТЧ</button>
            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ С ВКЛАДКАМИ -->
        <div class="right-panel" id="side-panel">
            <div class="tabs-header">
                <button class="tab-btn active" id="tab-btn-current" onclick="switchTab('current')">Текущий стак</button>
                <button class="tab-btn" id="tab-btn-finished" onclick="switchTab('finished')">Завершенные</button>
            </div>

            <!-- Вкладка ТЕКУЩИЙ СТАК -->
            <div class="tab-content active" id="tab-current">
                <div id="current-history-list"></div>
            </div>

            <!-- Вкладка ЗАВЕРШЕННЫЕ -->
            <div class="tab-content" id="tab-finished">
                <div style="display:flex; justify-content:flex-end; margin-bottom:15px;">
                    <button class="manage-btn" onclick="exportAllToCSV()" style="font-size:11px; padding:6px 12px;">⬇️ Скачать CSV</button>
                </div>
                <div id="finished-history-list"></div>
            </div>
        </div>
    </div>

    <!-- LIVE ТАБЛО -->
    <div id="viewer-ui" style="display:none; width:100%; height:100%; position:relative; z-index:10; overflow-y:auto;">
        <div class="viewer-container">
            <div class="live-badge">LIVE MATCH</div>
            
            <div class="viewer-scoreboard">
                <div class="viewer-team">
                    <h2>NFS</h2>
                    <div class="viewer-score nfs" id="v-score-nfs">0</div>
                </div>
                <div class="viewer-vs">VS</div>
                <div class="viewer-team">
                    <h2 id="v-enemy-name">ОЖИДАНИЕ</h2>
                    <div class="viewer-score enemy" id="v-score-enemy">0</div>
                </div>
            </div>

            <div class="viewer-roster" id="v-roster">Состав: Загрузка...</div>

            <div class="viewer-rounds" id="v-rounds-container"></div>
        </div>
    </div>

    <footer id="main-footer">
        &copy; 2026 <a href="https://vk.ru/need_for_speedl" target="_blank">Need For Speed</a> | Author: mefsol
    </footer>

    <!-- МОДАЛКИ -->
    <div class="modal-overlay" id="guildModal">
        <div class="modal-content">
            <h3>Гильдия врага</h3>
            <input type="text" id="guildInput" class="modal-input" placeholder="Название...">
            <button class="modal-btn" onclick="setEnemyGuild()">ОК</button>
        </div>
    </div>

    <div class="modal-overlay" id="editRoundModal">
        <div class="modal-content">
            <h3 style="color:var(--accent-red)">Редактировать раунд</h3>
            <textarea id="editRoundRosterInput" class="modal-input" style="height:80px; text-transform:none; font-size:14px;" placeholder="Состав..."></textarea>
            <input type="number" id="editRoundNfs" class="modal-input" placeholder="Счет NFS">
            <input type="number" id="editRoundEnemy" class="modal-input" placeholder="Счет Врага">
            <button class="modal-btn" onclick="saveEditedRound()">Сохранить</button>
        </div>
    </div>

    <div class="modal-overlay" id="playerManagerModal">
        <div class="modal-content">
            <h3>База игроков</h3>
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="text" id="newPlayerName" class="modal-input" style="margin:0;" placeholder="Ник...">
                <button class="modal-btn" style="width:50px;" onclick="addNewPlayer()">+</button>
            </div>
            <div id="playerListContainer" style="max-height:150px; overflow-y:auto; text-align:left; background:#000; padding:10px; margin-bottom:10px;"></div>
            <button class="modal-btn" onclick="closePlayerManager()">Готово</button>
        </div>
    </div>

    <div class="modal-overlay" id="viewRoundsModal">
        <div class="modal-content">
            <h3>История раундов</h3>
            <div id="roundsListContainer" style="max-height:300px; overflow-y:auto; text-align:left; background:#000; padding:10px; margin-bottom:10px;"></div>
            <button class="modal-btn" onclick="document.getElementById('viewRoundsModal').style.display = 'none'">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="editRosterModal">
        <div class="modal-content">
            <h3>Изменить состав</h3>
            <input type="text" id="editRosterInput" class="modal-input" style="text-transform:none;" placeholder="Введите состав...">
            <button class="modal-btn" onclick="saveEditedRoster()">Сохранить</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwetTu2JGB5EdgAIlVQwX94BzRxYiGqPg",
            authDomain: "nfs-tracker.firebaseapp.com",
            projectId: "nfs-tracker",
            storageBucket: "nfs-tracker.firebasestorage.app",
            messagingSenderId: "863438240758",
            appId: "1:863438240758:web:50d401740e2816f10265d7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const matchesCollection = collection(db, "nfs_matches");
        const rosterDocRef = doc(db, "nfs_settings", "roster");
        const liveDocRef = doc(db, "nfs_settings", "live_session"); 

        let currentEnemyGuild = "";
        let currentSessionRounds = [];
        let isSessionActive = false;
        let editingMatchId = null;
        let editingRoundIndex = null;
        let globalMatches = []; 
        let playerDatabase = [];
        let droppedState = { 1: false, 2: false, 3: false, 4: false };
        let isLiveBroadcast = false;

        // === ВКЛАДКИ ===
        window.switchTab = function(tab) {
            document.getElementById('tab-btn-current').classList.remove('active');
            document.getElementById('tab-btn-finished').classList.remove('active');
            document.getElementById('tab-current').classList.remove('active');
            document.getElementById('tab-finished').classList.remove('active');

            if(tab === 'current') {
                document.getElementById('tab-btn-current').classList.add('active');
                document.getElementById('tab-current').classList.add('active');
            } else {
                document.getElementById('tab-btn-finished').classList.add('active');
                document.getElementById('tab-finished').classList.add('active');
            }
        }

        // === LIVE ТАБЛО ===
        const isViewerMode = new URLSearchParams(window.location.search).has('live');

        if (isViewerMode) {
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('main-footer').style.display = 'none';
            document.body.classList.add('viewer-mode');
            document.getElementById('viewer-ui').style.display = 'block';

            onSnapshot(liveDocRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().active) {
                    const data = docSnap.data();
                    document.getElementById('v-score-nfs').innerText = data.scoreNfs;
                    document.getElementById('v-score-enemy').innerText = data.scoreEnemy;
                    document.getElementById('v-enemy-name').innerText = data.enemyGuild;
                    document.getElementById('v-roster').innerText = "Состав: " + (data.roster || "Не указан");
                    
                    const container = document.getElementById('v-rounds-container');
                    container.innerHTML = '';
                    
                    if (data.roundsData && data.roundsData.length > 0) {
                        data.roundsData.forEach(r => {
                            const div = document.createElement('div');
                            div.className = 'viewer-round-item';
                            div.innerHTML = `
                                <div>
                                    <div style="font-family:Oswald; font-size:14px; color:#888;">${r.time} ${r.isDrop ? '<span style="color:orange">(Не 8/8)</span>' : ''}</div>
                                    <div style="font-size:14px; margin-top:5px;">${r.roster || ''}</div>
                                </div>
                                <div class="viewer-round-score">${r.nfs} : ${r.enemy}</div>
                            `;
                            container.appendChild(div);
                        });
                    } else {
                        container.innerHTML = '<div style="text-align:center; color:#555; padding:20px;">Раунды еще не начались...</div>';
                    }
                } else {
                    document.getElementById('v-enemy-name').innerText = "МАТЧ ЗАВЕРШЕН";
                    document.getElementById('v-rounds-container').innerHTML = '';
                    document.getElementById('v-roster').innerText = '';
                }
            });
            throw new Error("Viewer mode active"); 
        }

        // === ОСНОВНАЯ ЛОГИКА ===
        window.updateLiveClock = function() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds}`;
            if (!isSessionActive) {
                document.getElementById('match-time').value = `${hours}:${minutes}`;
                document.getElementById('match-date').value = now.toISOString().split('T')[0];
            }
        };
        setInterval(window.updateLiveClock, 1000);
        window.updateLiveClock();

        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        for (let i = 0; i < 80; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 1.5 + 0.5, speedY: Math.random() * 0.4 + 0.1, opacity: Math.random() * 0.5 + 0.1, pulse: Math.random() * 0.02 + 0.01 });
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y -= p.speedY; p.opacity += p.pulse;
                if (p.opacity > 0.8 || p.opacity < 0.1) p.pulse = -p.pulse;
                if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220, 20, 20, ${p.opacity})`; ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        function pulseScore(id) {
            const el = document.getElementById(id);
            el.classList.add('pulse-anim');
            setTimeout(() => el.classList.remove('pulse-anim'), 150);
        }

        async function loadPlayersFromFirebase() {
            try {
                const docSnap = await getDoc(rosterDocRef);
                if (docSnap.exists()) playerDatabase = docSnap.data().players || [];
                else { playerDatabase = ["Игрок 1", "Игрок 2", "Игрок 3", "Игрок 4"]; await setDoc(rosterDocRef, { players: playerDatabase }); }
            } catch (e) { playerDatabase = JSON.parse(localStorage.getItem('nfs_players')) || ["Игрок 1", "Игрок 2", "Игрок 3", "Игрок 4"]; }
            updateRosterSelects();
            renderPlayerList();
        }

        async function savePlayersToFirebase() {
            try {
                await setDoc(rosterDocRef, { players: playerDatabase });
                localStorage.setItem('nfs_players', JSON.stringify(playerDatabase));
            } catch (e) { alert("Ошибка сохранения игроков."); }
        }

        window.openPlayerManager = () => document.getElementById('playerManagerModal').style.display = 'flex';
        window.closePlayerManager = () => { document.getElementById('playerManagerModal').style.display = 'none'; updateRosterSelects(); };

        window.addNewPlayer = async function() {
            let name = document.getElementById('newPlayerName').value.trim();
            if (name && !playerDatabase.includes(name)) {
                playerDatabase.push(name);
                await savePlayersToFirebase();
                document.getElementById('newPlayerName').value = '';
                renderPlayerList();
                updateRosterSelects();
            }
        }
        window.removePlayer = async function(index) {
            playerDatabase.splice(index, 1);
            await savePlayersToFirebase();
            renderPlayerList();
            updateRosterSelects();
        }

        function renderPlayerList() {
            const container = document.getElementById('playerListContainer');
            container.innerHTML = '';
            playerDatabase.forEach((p, index) => {
                const div = document.createElement('div');
                div.style.display = 'flex'; div.style.justifyContent = 'space-between';
                div.innerHTML = `<span>${p}</span><button onclick="removePlayer(${index})" style="background:none;border:none;color:red;cursor:pointer;">✕</button>`;
                container.appendChild(div);
            });
        }

        function updateRosterSelects() {
            for (let i = 1; i <= 4; i++) {
                let mainSelect = document.getElementById(`player${i}`);
                let subSelect = document.getElementById(`player${i}_sub`);
                let currentMainVal = mainSelect.value;
                let currentSubVal = subSelect.value;
                mainSelect.innerHTML = `<option value="">Игрок ${i}</option>`;
                subSelect.innerHTML = `<option value="">Замена</option>`;
                playerDatabase.forEach(p => {
                    let opt1 = document.createElement('option'); opt1.value = p; opt1.textContent = p;
                    let opt2 = document.createElement('option'); opt2.value = p; opt2.textContent = p;
                    mainSelect.appendChild(opt1);
                    subSelect.appendChild(opt2);
                });
                if (currentMainVal) mainSelect.value = currentMainVal;
                if (currentSubVal) subSelect.value = currentSubVal;
            }
        }

        window.toggleDrop = function(btn, playerIndex) {
            droppedState[playerIndex] = !droppedState[playerIndex];
            if (droppedState[playerIndex]) btn.classList.add('active');
            else btn.classList.remove('active');
            updateLiveSession();
        }

        window.startSession = function() {
            document.getElementById('startScreen').style.display = 'none';
            isSessionActive = true;
            document.getElementById('score-nfs').value = 0;
            document.getElementById('score-enemy').value = 0;
            
            currentSessionRounds = [];
            document.getElementById('current-history-list').innerHTML = '';
            document.getElementById('enemy-guild-display').innerText = 'ВРАГ';
            document.getElementById('enemy-guild-display').style.fontSize = '28px';
            currentEnemyGuild = "";
            droppedState = { 1: false, 2: false, 3: false, 4: false };
            document.querySelectorAll('.drop-btn').forEach(btn => btn.classList.remove('active'));
            updateRosterSelects();
            clearRoster();
            updateLiveSession();
            switchTab('current'); // Переключаем вкладку на текущий
        };

        window.openModal = function() {
            if (!isSessionActive) return;
            document.getElementById('guildModal').style.display = 'flex';
            document.getElementById('guildInput').focus();
            if (currentEnemyGuild) document.getElementById('guildInput').value = currentEnemyGuild;
        };
        window.setEnemyGuild = function() {
            const val = document.getElementById('guildInput').value.trim().toUpperCase();
            if (val) {
                currentEnemyGuild = val;
                document.getElementById('enemy-guild-display').innerText = val;
                document.getElementById('guildModal').style.display = 'none';
                updateLiveSession();
            }
        };
        document.getElementById('guildInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') window.setEnemyGuild(); });

        window.changeScore = function(id, amount) {
            if (!isSessionActive) return;
            const el = document.getElementById(id);
            let val = parseInt(el.value) || 0;
            val += amount;
            if (val < 0) val = 0;
            el.value = val;
            pulseScore(id);
            updateLiveSession();
        };

        window.clearRoster = function() {
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`player${i}`).value = '';
                document.getElementById(`player${i}_sub`).value = '';
            }
        };

        function getRosterString() {
            let roster = [];
            for (let i = 1; i <= 4; i++) {
                let name = document.getElementById(`player${i}`).value;
                let sub = document.getElementById(`player${i}_sub`).value;
                if (name) {
                    let text = name;
                    if (droppedState[i]) text = `<span class="dropped">${name}</span>`;
                    if (sub) text += ` (замена: ${sub})`;
                    roster.push(text);
                }
            }
            return roster.join(', ');
        }

        window.startLiveBroadcast = async function() {
            if (!isSessionActive) { alert("Сначала начните стак!"); return; }
            isLiveBroadcast = true;
            document.getElementById('live-btn').innerText = "🔴 LIVE ВКЛЮЧЕН (Скопировать ссылку)";
            document.getElementById('live-btn').style.background = "#fff";
            document.getElementById('live-btn').style.color = "#cc0000";
            
            await updateLiveSession();
            
            const currentUrl = window.location.href.split('?')[0];
            const liveUrl = currentUrl + '?live=true';
            navigator.clipboard.writeText(liveUrl).then(() => {
                alert(`Ссылка на LIVE-табло скопирована!\n\nОтправь её зрителям:\n${liveUrl}`);
            });
        }

        async function updateLiveSession() {
            if (!isLiveBroadcast) return;
            const scoreNfs = document.getElementById('score-nfs').value;
            const scoreEnemy = document.getElementById('score-enemy').value;
            const roster = getRosterString();
            
            await setDoc(liveDocRef, {
                active: true,
                enemyGuild: currentEnemyGuild || "Ожидание...",
                scoreNfs: scoreNfs,
                scoreEnemy: scoreEnemy,
                roster: roster,
                roundsData: currentSessionRounds,
                timestamp: Date.now()
            });
        }

        window.saveRound = function() {
            if (!isSessionActive) return;
            if (!currentEnemyGuild) { alert('Сначала выбери врага!'); return; }
            const scoreNfs = parseInt(document.getElementById('score-nfs').value) || 0;
            const scoreEnemy = parseInt(document.getElementById('score-enemy').value) || 0;
            const isDrop = document.getElementById('player-drop').checked;
            if (scoreNfs === 0 && scoreEnemy === 0) { alert('Счет 0:0, нечего сохранять.'); return; }
            
            const now = new Date();
            const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const rosterString = getRosterString();
            
            const roundData = { time: timeString, nfs: scoreNfs, enemy: scoreEnemy, isDrop: isDrop, roster: rosterString };
            currentSessionRounds.unshift(roundData);
            renderCurrentRounds();
            updateLiveSession();
            
            document.getElementById('player-drop').checked = false;
        };

        window.removeCurrentRound = function(index) {
            if(confirm('Удалить этот раунд?')) {
                currentSessionRounds.splice(index, 1);
                renderCurrentRounds();
                updateLiveSession();
            }
        }

        window.openEditRound = function(index) {
            editingRoundIndex = index;
            const round = currentSessionRounds[index];
            document.getElementById('editRoundRosterInput').value = round.roster.replace(/<[^>]*>/g, '');
            document.getElementById('editRoundNfs').value = round.nfs;
            document.getElementById('editRoundEnemy').value = round.enemy;
            document.getElementById('editRoundModal').style.display = 'flex';
        }

        window.saveEditedRound = function() {
            if (editingRoundIndex === null) return;
            currentSessionRounds[editingRoundIndex].roster = document.getElementById('editRoundRosterInput').value;
            currentSessionRounds[editingRoundIndex].nfs = parseInt(document.getElementById('editRoundNfs').value) || 0;
            currentSessionRounds[editingRoundIndex].enemy = parseInt(document.getElementById('editRoundEnemy').value) || 0;
            document.getElementById('editRoundModal').style.display = 'none';
            editingRoundIndex = null;
            renderCurrentRounds();
            updateLiveSession();
        }

        function renderCurrentRounds() {
            const list = document.getElementById('current-history-list');
            list.innerHTML = '';
            currentSessionRounds.forEach((round, index) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; width:100%;">
                        <div class="history-info">
                            <div class="history-date">${round.time}</div>
                            ${round.isDrop ? '<div class="history-note">Не 8/8</div>' : ''}
                        </div>
                        <div style="display:flex; align-items:center;">
                            <div class="history-score">${round.nfs} : ${round.enemy}</div>
                        </div>
                    </div>
                    <div class="history-roster" style="margin-top:8px;"><span>Состав:</span> ${round.roster}</div>
                    <div class="history-controls">
                        <button class="ctrl-btn" onclick="openEditRound(${index})">✏️ Изменить</button>
                        <button class="ctrl-btn" style="color:var(--accent-red)" onclick="removeCurrentRound(${index})">🗑️ Удалить</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        window.finishMatch = async function() {
            if (!isSessionActive) return;
            if (currentSessionRounds.length === 0) { alert('Вы не сохранили ни одного раунда!'); return; }
            const finalNfs = parseInt(document.getElementById('score-nfs').value) || 0;
            const finalEnemy = parseInt(document.getElementById('score-enemy').value) || 0;
            const lastRound = currentSessionRounds[0];
            const totalNfs = finalNfs !== 0 ? finalNfs : lastRound.nfs;
            const totalEnemy = finalEnemy !== 0 ? finalEnemy : lastRound.enemy;
            const finalRoster = getRosterString();
            const date = document.getElementById('match-date').value;
            const matchData = {
                timestamp: Date.now(),
                date: date,
                enemy: currentEnemyGuild,
                scoreNfs: totalNfs,
                scoreEnemy: totalEnemy,
                rounds: currentSessionRounds.length,
                roundsData: currentSessionRounds,
                isDrop: currentSessionRounds.some(r => r.isDrop),
                roster: finalRoster
            };
            try {
                await addDoc(matchesCollection, matchData);
                document.getElementById('startScreen').style.display = 'flex';
                isSessionActive = false;
                
                if(isLiveBroadcast) { 
                    isLiveBroadcast = false; 
                    await setDoc(liveDocRef, { active: false }); 
                    document.getElementById('live-btn').innerText = "🔴 Включить LIVE-ТАБЛО";
                    document.getElementById('live-btn').style.background = "";
                    document.getElementById('live-btn').style.color = "";
                }
                switchTab('finished'); // Переключаем на завершенные
            } catch (e) { alert("Ошибка!"); }
        };

        window.openEditRoster = function(id) {
            editingMatchId = id;
            let match = globalMatches.find(m => m.id === id);
            if (match) {
                let cleanRoster = match.roster.replace(/<[^>]*>/g, '');
                document.getElementById('editRosterInput').value = cleanRoster || '';
                document.getElementById('editRosterModal').style.display = 'flex';
                document.getElementById('editRosterInput').focus();
            }
        };
        window.saveEditedRoster = async function() {
            if (!editingMatchId) return;
            let newRoster = document.getElementById('editRosterInput').value.trim();
            try {
                await updateDoc(doc(db, "nfs_matches", editingMatchId), { roster: newRoster });
                document.getElementById('editRosterModal').style.display = 'none';
                editingMatchId = null;
            } catch (e) {}
        };
        window.deleteMatch = async function(id) {
            if (confirm('Удалить матч из истории?')) {
                try { await deleteDoc(doc(db, "nfs_matches", id)); } catch (e) {}
            }
        };

        window.viewRounds = function(id) {
            let match = globalMatches.find(m => m.id === id);
            if (match && match.roundsData) {
                const container = document.getElementById('roundsListContainer');
                container.innerHTML = '';
                match.roundsData.forEach(round => {
                    const div = document.createElement('div');
                    div.style.padding = '5px 0'; div.style.borderBottom = '1px solid #222';
                    div.innerHTML = `<div>${round.time} ${round.isDrop ? '(Не 8/8)' : ''}</div><div>${round.roster || ''}</div><div style="font-weight:bold; color:#cc0000">${round.nfs} : ${round.enemy}</div>`;
                    container.appendChild(div);
                });
                document.getElementById('viewRoundsModal').style.display = 'flex';
            } else alert("История раундов недоступна.");
        }

        window.exportAllToCSV = function() {
            if(globalMatches.length === 0) { alert("Нет матчей для экспорта."); return; }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "Дата,Противник,Счет NFS,Счет Врага,Раундов,Вылеты,Состав\n";
            
            globalMatches.forEach(m => {
                let cleanRoster = m.roster.replace(/<[^>]*>/g, '');
                let dropText = m.isDrop ? "Да" : "Нет";
                csvContent += `${m.date},${m.enemy},${m.scoreNfs},${m.scoreEnemy},${m.rounds},${dropText},"${cleanRoster}"\n`;
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "nfs_all_matches.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.toggleAccordion = function(event, id) {
            if (event.target.tagName === 'BUTTON') return;
            const content = document.getElementById(`acc-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.innerText = '▼';
            } else {
                content.classList.add('open');
                icon.innerText = '▲';
            }
        }

        function loadFinishedHistory() {
            const q = query(matchesCollection, orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                globalMatches = [];
                const historyList = document.getElementById('finished-history-list');
                historyList.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const match = docSnap.data();
                    match.id = docSnap.id; 
                    globalMatches.push(match);
                    
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    const dateObj = new Date(match.date);
                    const formattedDate = dateObj.toLocaleDateString('ru-RU');
                    
                    let winIcon = match.scoreNfs > match.scoreEnemy ? '<span style="color:gold">🏆</span>' : (match.scoreNfs < match.scoreEnemy ? '<span style="color:gray">💀</span>' : '<span style="color:orange">🔥</span>');
                    
                    item.innerHTML = `
                        <div class="history-main-row" onclick="toggleAccordion(event, '${match.id}')">
                            <div class="history-info">
                                <div class="history-date">${formattedDate} (${match.rounds} р.)</div>
                                <div class="history-matchup">${winIcon} NFS vs ${match.enemy}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <div class="history-score">${match.scoreNfs} : ${match.scoreEnemy}</div>
                                <div id="icon-${match.id}" style="color:#666; font-size:12px;">▼</div>
                            </div>
                        </div>
                        <div class="accordion-content" id="acc-${match.id}">
                            ${match.isDrop ? '<div class="history-note">Были вылеты</div>' : ''}
                            <div class="history-roster" style="margin-top:10px;">
                                <span>Состав:</span> ${match.roster || 'Не указан'}
                            </div>
                            <div class="history-controls">
                                <button class="ctrl-btn" onclick="openEditRoster('${match.id}')">✏️ Изменить</button>
                                <button class="ctrl-btn" onclick="viewRounds('${match.id}')">👁️ Раунды</button>
                                <button class="ctrl-btn" onclick="copyMatchToClipboard('${match.id}')">📋 Скопировать</button>
                                <button class="ctrl-btn" onclick="downloadMatchTXT('${match.id}')">⬇️ Скачать</button>
                                <button class="ctrl-btn delete-btn" onclick="deleteMatch('${match.id}')">🗑️ Удалить</button>
                            </div>
                        </div>
                    `;
                    historyList.appendChild(item);
                });
            });
        }

        window.copyMatchToClipboard = function(id) {
            let match = globalMatches.find(m => m.id === id);
            if (!match) return;
            
            let cleanRoster = match.roster.replace(/<[^>]*>/g, '');
            let text = `📅 Дата: ${match.date}\n⚔️ Против: ${match.enemy}\n🏆 Итоговый счет: ${match.scoreNfs} : ${match.scoreEnemy}\n👥 Состав: ${cleanRoster}\n`;
            if (match.isDrop) text += `⚠️ Играли не 8/8\n`;
            
            if (match.roundsData && match.roundsData.length > 0) {
                text += `\n--- ИСТОРИЯ РАУНДОВ ---\n`;
                match.roundsData.forEach((r, i) => {
                    let cleanRRoster = r.roster ? r.roster.replace(/<[^>]*>/g, '') : '';
                    text += `${i+1}. [${r.time}] Счет: ${r.nfs} : ${r.enemy} ${r.isDrop ? '(Не 8/8)' : ''} | Состав: ${cleanRRoster}\n`;
                });
            }
            
            navigator.clipboard.writeText(text).then(() => {
                alert('Полный текст (с раундами) скопирован!');
            }).catch(err => {
                alert('Ошибка при копировании: ' + err);
            });
        }

        window.downloadMatchTXT = function(id) {
            let match = globalMatches.find(m => m.id === id);
            if (!match) return;
            
            let cleanRoster = match.roster.replace(/<[^>]*>/g, '');
            let text = `--- NFS GUILD STATS ---\n\nДата: ${match.date}\nПротивник: ${match.enemy}\nИтоговый счет: ${match.scoreNfs} : ${match.scoreEnemy}\nСостав: ${cleanRoster}\n`;
            if (match.isDrop) text += `Примечание: играли не 8/8\n`;
            
            if (match.roundsData && match.roundsData.length > 0) {
                text += `\n--- ИСТОРИЯ РАУНДОВ ---\n`;
                match.roundsData.forEach((r, i) => {
                    let cleanRRoster = r.roster ? r.roster.replace(/<[^>]*>/g, '') : '';
                    text += `Раунд ${i+1} [${r.time}]: ${r.nfs} : ${r.enemy} ${r.isDrop ? '(Не 8/8)' : ''}\nСостав: ${cleanRRoster}\n\n`;
                });
            }
            
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `match_${match.enemy}_${match.date}.txt`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadPlayersFromFirebase();
            loadFinishedHistory();
        });
    </script>
</body>
</html>
