<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFS Guild Stats</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #08080a;
            --bg-panel: rgba(20, 12, 12, 0.6);
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-red: #cc0000;
            --accent-glow: rgba(204, 0, 0, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at 50% 50%, #0a0000 0%, #050505 60%, #1a0000 100%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #stars-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .main-content {
            display: flex;
            flex: 1;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .left-panel {
            flex: 1.5;
            padding: 25px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 0, 0, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .start-btn {
            background: var(--accent-red); color: white;
            font-family: 'Oswald', sans-serif; font-size: 40px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 5px;
            padding: 30px 80px; border: none;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            cursor: pointer; box-shadow: 0 0 40px var(--accent-glow);
            transition: 0.3s;
        }
        .start-btn:hover { background: #ff1a1a; transform: scale(1.05); box-shadow: 0 0 60px var(--accent-glow); }

        .top-bar {
            display: flex; gap: 15px; margin-bottom: 10px;
            justify-content: center; align-items: center;
        }

        input[type="date"], input[type="time"] {
            font-family: 'Oswald', sans-serif; font-size: 20px;
            background: var(--input-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); color: var(--text-main);
            padding: 10px 20px; border-radius: 12px; outline: none;
            text-align: center; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .clock-display {
            font-family: 'Oswald', sans-serif; font-size: 20px;
            background: rgba(204, 0, 0, 0.15); backdrop-filter: blur(10px);
            border: 1px solid rgba(204, 0, 0, 0.5); color: var(--accent-red);
            padding: 10px 20px; border-radius: 12px; font-weight: 700;
            box-shadow: 0 0 15px rgba(204,0,0,0.2);
        }

        .player-manager { display: flex; justify-content: center; margin-bottom: 15px; }
        .manage-btn {
            background: transparent; color: var(--text-muted);
            border: 1px solid var(--border-color); padding: 6px 15px;
            border-radius: 6px; font-size: 12px; cursor: pointer;
            transition: 0.3s; font-family: 'Oswald', sans-serif; text-transform: uppercase;
        }
        .manage-btn:hover { color: var(--text-main); border-color: var(--accent-red); box-shadow: 0 0 10px rgba(204,0,0,0.3); }

        .roster-block {
            display: flex; gap: 10px; justify-content: center;
            margin-bottom: 15px; max-width: 800px; margin-left: auto; margin-right: auto;
        }

        .roster-col { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
        .select-row { display: flex; gap: 5px; }

        select.roster-input {
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700;
            background: var(--input-bg); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 8px 5px; border-radius: 6px;
            outline: none; text-align: center; transition: 0.3s;
            width: 100%; box-sizing: border-box; cursor: pointer;
            appearance: none; -webkit-appearance: none; -moz-appearance: none;
            text-align-last: center;
        }
        select.roster-input:focus { border-color: var(--accent-red); background: rgba(204, 0, 0, 0.1); box-shadow: 0 0 10px var(--accent-glow); }
        select.roster-input option { background: #110a0a; color: #fff; }

        .drop-btn {
            background: #1a0a0a; border: 2px solid #331111; color: #555;
            border-radius: 6px; font-size: 18px; cursor: pointer; padding: 0 12px;
            transition: 0.3s; font-weight: bold; display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 5px black;
        }
        .drop-btn:hover { border-color: var(--accent-red); color: #ff4444; }
        .drop-btn.active { background: var(--accent-red); color: white; box-shadow: 0 0 15px var(--accent-red); border-color: #ff1a1a; }

        .vs-container {
            display: flex; align-items: center; justify-content: space-evenly;
            flex: 1; margin: 0;
        }

        .circle-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .guild-circle {
            width: 260px; height: 260px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-family: 'Oswald', sans-serif;
            font-weight: 700; font-size: 36px; text-transform: uppercase;
            padding: 20px; box-sizing: border-box; word-break: break-word;
            line-height: 1.1; background: radial-gradient(circle at 30% 30%, #1c0a0a 0%, #080505 100%);
            border: 3px solid var(--border-color); position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,1), 0 10px 40px rgba(0,0,0,0.8);
            transition: 0.3s; text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .guild-circle.nfs { border-color: var(--accent-red); box-shadow: 0 0 40px var(--accent-glow), inset 0 0 40px rgba(204,0,0,0.2); }
        .guild-circle.enemy { cursor: pointer; }
        .guild-circle.enemy:hover { border-color: var(--text-main); box-shadow: 0 0 50px rgba(255,255,255,0.3), inset 0 0 30px rgba(255,255,255,0.1); transform: scale(1.02); }

        .progress-bar-bg {
            width: 200px; height: 8px; background: #111; border-radius: 4px;
            border: 1px solid #333; overflow: hidden; box-shadow: inset 0 0 5px black;
        }
        .progress-bar-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #550000, #ff1a1a);
            transition: width 0.5s ease-out; box-shadow: 0 0 10px var(--accent-red);
        }

        .vs-text {
            font-family: 'Oswald', sans-serif; font-size: 90px; font-weight: 700; font-style: italic;
            color: var(--text-main); text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 0 0 30px rgba(204, 0, 0, 0.6);
            margin: 0 20px; z-index: 2;
        }

        .score-container { display: flex; align-items: center; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .score-block {
            display: flex; align-items: center; gap: 15px; background: var(--input-bg);
            padding: 10px 25px; border-radius: 12px; border: 1px solid var(--border-color);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
        }

        .score-input {
            width: 90px; font-family: 'Oswald', sans-serif; font-size: 65px; font-weight: 700;
            text-align: center; background: transparent; border: none; color: var(--text-main);
            transition: transform 0.1s ease, color 0.2s;
        }
        .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
